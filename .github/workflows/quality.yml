name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - production/tiger-gym-saas-upgrade

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Product tests
        run: npm test
      - name: Firestore rules tests
        run: npm run test:rules
      - name: Production build
        run: npm run build
